name: Deploy POS Server - Staging

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Define branch -> environment mapping
            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              ENV="production"
              DIR="/var/www/pos.abheepay.com/pos-server"
              PM2_APP="pos-server"
            elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
              ENV="staging"
              DIR="/var/www/pos-staging.abheepay.com/pos-server"
              PM2_APP="pos-server-staging"
            else
              echo "Unsupported branch: ${{ github.ref }}"
              exit 1
            fi

            echo "Deploying $ENV to $DIR"

            if [ -d "$DIR" ]; then
              cd $DIR
            else
              echo "Directory $DIR does not exist."
              exit 1
            fi

            echo "⚙️ Loading Node / NVM environment..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "🔄 Syncing code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "📦 Installing dependencies..."
            npm install --production

            # Run migrations!
            echo "🗄️ Running migrations..."
            npx sequelize db:migrate --env $ENV || npx sequelize-cli db:migrate --env $ENV || true

            # Restart the backend app
            echo "🔁 Restarting PM2..."
            pm2 restart $PM2_APP --update-env || pm2 reload $PM2_APP --update-env

            echo "Deployment completed successfully!"
