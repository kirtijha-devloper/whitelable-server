name: Deploy POS Server - Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/pos-staging.abheepay.com/pos-server
            git fetch origin
            git reset --hard origin/staging
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 14
            npm install --production
            mkdir -p logs
            NODE_ENV=staging npx sequelize db:migrate || { echo "Migration failed"; exit 1; }
            pm2 reload ecosystem.config.js --only pos-server-staging || pm2 start ecosystem.config.js --only pos-server-staging
            echo "Staging deployed"
